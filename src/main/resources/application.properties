spring.application.name=jobagent
spring.datasource.url=jdbc:postgresql://localhost:5433/jobagent
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Job search preferences
job-search.target-roles[0]=Software Developer
job-search.target-roles[1]=Backend Developer
job-search.target-roles[2]=Full-Stack Developer
job-search.target-roles[3]=Frontend Developer

job-search.technologies[0]=Node.js
job-search.technologies[1]=React
job-search.technologies[2]=Next.js
job-search.technologies[3]=TypeScript
job-search.technologies[4]=JavaScript
job-search.technologies[5]=HTML
job-search.technologies[6]=CSS
job-search.technologies[7]=MySQL
job-search.technologies[8]=PostgreSQL
job-search.technologies[9]=MongoDb
job-search.technologies[10]=jQuery
job-search.technologies[11]=Docker
job-search.technologies[12]=Java
job-search.technologies[13]=Spring Boot

job-search.locations[0]=Lithuania
job-search.locations[1]=Remote Europe
job-search.locations[2]=Remote USA
job-search.locations[3]=Remote Canada
job-search.locations[4]=Remote United States of America

job-search.seniority[0]=Junior
job-search.seniority[1]=Entry-level
job-search.seniority[2]=Middle

job-search.minimum-relevance-score=50

#CLAUDE AI
anthropic.api-key=${ANTHROPIC_API_KEY}
anthropic.model=claude-haiku-5-5

# Run every day at 08:00 Lithuania time
job-agent.schedule.cron=0 0 8 * * *
job-agent.schedule.zone=Europe/Vilnius

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true

# Prevent mail operations from hanging indefinitely
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000